<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register</title>
    <link rel="stylesheet" href="styles/styles.css">
</head>
<body>
    <main class="register-container">
        <div class="title-flex">
            <h2 class="title">Register</h2>
            <p>Find your <span>Essence</span></p>
            <img src="" alt="The image didn't load">
        </div>
        <div class="flex-container">
            <form class="flex__element form-container">
                <label for="email-input">Email</label>
                <input class="form__input" type="email" name="" id="email-input">
                <label for="password-input">Password</label>
                <input class="form__input" type="password" id="password-input">
                <button type="submit" class="submit-button">Submit</button>
            </form>
        </div>
    </main>
</body>
</html>
